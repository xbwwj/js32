[workspace]
resolver = "2"
members = [
  "crates/cargo-js32",
  "crates/js-dialect",
  "crates/js-export",
  "crates/js-import",
  "crates/js-transform",
  "crates/js32-linker",
  "crates/mir-dialect",
  "crates/mir-import",
  "crates/mir-lower",
  "crates/rustc-codegen-js"
]

[workspace.dependencies]
pliron = "0.20.0"
