[workspace]
resolver = "2"
members = [
  "compiler/cargo-js",
  "compiler/jsld",
  "compiler/js-dialect",
  "compiler/js-export",
  "compiler/js-import",
  "compiler/js-transform",
  "compiler/mir-dialect",
  "compiler/mir-import",
  "compiler/mir-lower",
  "compiler/rustc-codegen-js",
  "library/js32-sys",
  "library/web32-sys",
  "library/js32-macros"
]

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }

oxc_allocator = "0.158.0"
oxc_ast = { version = "0.158.0", features = ["serialize"] }
oxc_parser = "0.158.0"
oxc_span = "0.158.0"
oxc_codegen = "0.158.0"
oxc_syntax = "0.158.0"

pliron = "0.20.0"
